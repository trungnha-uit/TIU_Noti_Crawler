name: Daily Portal Notification Crawl

on:
  schedule:
    # Run every day at 8:00 AM UTC+7 (1:00 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run crawler
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
          CTSV_BASE_URL: ${{ secrets.CTSV_BASE_URL }}
          KHTC_BASE_URL: ${{ secrets.KHTC_BASE_URL }}
        run: |
          python crawl_notifications.py
